## geometry
geometry.prob_lo = [-0.5, -0.5, -0.5]
geometry.prob_hi = [0.5, 0.5, 0.5]
quokka.bc = ["periodic", "periodic", "periodic"]

## resolution
amr.n_cell = [1024, 1024, 1024]
amr.max_level = 0
amr.max_grid_size_x = 128
amr.max_grid_size_y = 128
amr.max_grid_size_z = 128
amr.blocking_factor_x = 32
amr.blocking_factor_y = 32
amr.blocking_factor_z = 32

## verbosity
amr.v = 1

## output
checkpoint_interval = -1
checkpointtime_interval = 0.005
checkpoint_prefix = "checkpoints/chk"
plottime_interval = 0.0025
plotfile_prefix = "snapshots/plt"
derived_vars = ["magnetic_divergence"]

## time integration
cfl = 0.3
stop_time = 0.05
max_timesteps = 10000
do_reflux = 0
do_subcycle = 0

## hydro
hydro.rk_integrator_order = 2
hydro.reconstruction_order = 3

## mhd
mhd.emf_compute_scheme = "Quokka2026"
mhd.emf_averaging_scheme = "Balsara2025"
mhd.emf_reconstruction_order = 3
