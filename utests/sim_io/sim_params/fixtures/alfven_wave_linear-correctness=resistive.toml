## geometry
geometry.prob_lo = [0.0, 0.0, 0.0]
geometry.prob_hi = [1.0, 1.0, 1.0]
quokka.bc = ["periodic", "periodic", "periodic"]

## resolution
amr.n_cell = [256, 8, 8]
amr.max_level = 0
amr.max_grid_size_x = 256
amr.max_grid_size_y = 256
amr.max_grid_size_z = 256
amr.blocking_factor_x = 256
amr.blocking_factor_y = 8
amr.blocking_factor_z = 8

## verbosity
amr.v = 1

## output
checkpoint_interval = -1
plotfile_interval = 100
plotfile_prefix = "snapshots/plt"

## time integration
cfl = 0.3
stop_time = 5.0
max_timesteps = 100000
do_subcycle = 0

## hydro
hydro.rk_integrator_order = 2
hydro.reconstruction_order = 3
hydro.use_dual_energy = 0

## mhd
mhd.emf_compute_scheme = "Quokka2026"
mhd.emf_averaging_scheme = "Balsara2025"
mhd.emf_reconstruction_order = 3
mhd.resistivity = 0.0001

## problem setup
setup.run_sim = 1
setup.run_convergence = 0
setup.angle_between_k_b0 = 0
setup.num_modes_x = 1
setup.num_modes_y = 0
setup.num_modes_z = 0
