## geometry
geometry.prob_lo = [0.0, 0.0, 0.0]
geometry.prob_hi = [1.0, 1.0, 1.0]
# BCs are hardcoded in problem_main() as ext_dir in x, periodic in y/z; this key is not read.
quokka.bc = ["ext_dir", "periodic", "periodic"]

## resolution
amr.n_cell = [128, 128, 8]
amr.max_level = 0
amr.max_grid_size_x = 32
amr.max_grid_size_y = 32
amr.max_grid_size_z = 32
amr.blocking_factor_x = 16
amr.blocking_factor_y = 16
amr.blocking_factor_z = 8

## verbosity
amr.v = 1

## output
checkpoint_interval = -1
plotfile_interval = 25
plotfile_prefix = "snapshots/plt"

## time integration
# cfl/stop_time/max_timesteps are hardcoded in problem_main() after construction, overwriting
# whatever this file sets (see ProjectNotes codebases/quokka/threads/dead-toml-params/); values
# below are the true runtime-effective ones, not what kriel-quokka-mhd's checked-in file has.
cfl = 0.4
stop_time = 0.4
max_timesteps = 2000

## hydro
hydro.rk_integrator_order = 2
hydro.reconstruction_order = 5

## mhd
mhd.emf_compute_scheme = "Quokka2026"
mhd.emf_averaging_scheme = "Balsara2025"
mhd.emf_reconstruction_order = 5
