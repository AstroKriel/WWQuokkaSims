## geometry
geometry.prob_lo = [0.0, 0.0, 0.0]
geometry.prob_hi = [1.0, 1.0, 1.0]
quokka.bc = ["periodic", "periodic", "periodic"]

## resolution
amr.n_cell = [128, 128, 128]
amr.max_level = 0
amr.max_grid_size_x = 128
amr.max_grid_size_y = 128
amr.max_grid_size_z = 128
amr.blocking_factor_x = 128
amr.blocking_factor_y = 128
amr.blocking_factor_z = 128

## verbosity
amr.v = 1

## output
checkpoint_interval = -1
plotfile_interval = 25
plotfile_prefix = "snapshots/plt"

## time integration
cfl = 0.3
stop_time = 0.987669
max_timesteps = 100000

## hydro
hydro.rk_integrator_order = 2
hydro.reconstruction_order = 5

## mhd
mhd.emf_compute_scheme = "Quokka2026"
mhd.emf_averaging_scheme = "Balsara2025"
mhd.emf_reconstruction_order = 5

## problem setup
setup.run_sim = 1
setup.run_convergence = 0
setup.angle_between_k_b0 = 45
setup.num_modes_x = 1
setup.num_modes_y = 2
setup.num_modes_z = 3
