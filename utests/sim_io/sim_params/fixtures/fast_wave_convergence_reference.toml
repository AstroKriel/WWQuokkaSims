## geometry
geometry.prob_lo = [0.0, 0.0, 0.0]
geometry.prob_hi = [1.0, 1.0, 1.0]
geometry.is_periodic = [1, 1, 1]

## resolution
amr.n_cell = [128, 8, 8]
amr.max_level = 0
amr.blocking_factor_x = 16
amr.blocking_factor_y = 8
amr.blocking_factor_z = 8
amr.max_grid_size_x = 128
amr.max_grid_size_y = 128
amr.max_grid_size_z = 128

## verbosity
amr.v = 1

## output
plotfile_interval = -1

## time integration
do_reflux = 0
do_subcycle = 0
do_tracers = 1
cfl = 0.3

## hydro
hydro.rk_integrator_order = 2
hydro.reconstruction_order = 5
hydro.use_dual_energy = 0

## mhd
mhd.emf_compute_scheme = "Quokka2026"
mhd.emf_averaging_scheme = "Balsara2025"
mhd.emf_reconstruction_order = 5

## wave setup
setup.num_modes_x = 1
setup.num_modes_y = 0
setup.num_modes_z = 0
setup.angle_between_k_b0 = 90
setup.machine_precision_target = 0
setup.nx_max = 2048
