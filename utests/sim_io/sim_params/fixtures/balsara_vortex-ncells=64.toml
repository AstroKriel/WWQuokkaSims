## geometry
geometry.prob_lo = [-5.0, -5.0, -0.078125]
geometry.prob_hi = [5.0, 5.0, 0.078125]
quokka.bc = ["periodic", "periodic", "periodic"]

## resolution
amr.n_cell = [64, 64, 8]
amr.max_level = 0
amr.max_grid_size_x = 64
amr.max_grid_size_y = 64
amr.max_grid_size_z = 64
amr.blocking_factor_x = 64
amr.blocking_factor_y = 64
amr.blocking_factor_z = 8

## verbosity
amr.v = 1

## output
checkpoint_interval = -1
plotfile_interval = 5000
plotfile_prefix = "snapshots/plt"

## time integration
cfl = 0.3
max_timesteps = 800000

## hydro
hydro.rk_integrator_order = 2
hydro.reconstruction_order = 3

## mhd
mhd.emf_compute_scheme = "Quokka2026"
mhd.emf_averaging_scheme = "Balsara2025"
mhd.emf_reconstruction_order = 3

## problem setup
setup.vortex_Mach = 0.01
setup.vortex_b_magn = 0.01
setup.advection = 1
setup.num_orbits = 3
